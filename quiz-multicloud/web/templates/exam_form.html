{% extends "base.html" %}
{% block title %}Tạo bài thi{% endblock %}
{% block content %}
<div class="card p-4 col-lg-8">
  <h4>Tạo bài thi mới</h4>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label">Tên bài thi</label><input name="title" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">Mô tả</label><textarea name="description" class="form-control" rows="2"></textarea></div>
    <div class="row">
      <div class="col mb-3"><label class="form-label">Thời gian (phút)</label><input name="duration_minutes" type="number" min="1" value="15" class="form-control"></div>
      <div class="col mb-3"><label class="form-label">Điểm đạt (%)</label><input name="pass_percent" type="number" min="0" max="100" value="50" class="form-control"></div>
    </div>
    <button class="btn btn-primary">Tạo</button>
    <a href="{{ url_for('teacher_dashboard') }}" class="btn btn-link">Huỷ</a>
  </form>
</div>
{% endblock %}
