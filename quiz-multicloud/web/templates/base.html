<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}QuizCloud{% endblock %} · QuizCloud</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #f5f7fb; }
    .card { border: 0; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .brand-badge { font-size: .7rem; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="{{ url_for('index') }}"><i class="bi bi-ui-checks-grid"></i> QuizCloud</a>
    <span class="badge text-bg-light brand-badge me-auto">Azure + AWS</span>
    {% if g.user %}
      <span class="navbar-text text-white me-3">
        <i class="bi bi-person-circle"></i> {{ g.user.name }}
        <span class="badge text-bg-warning">{{ 'Giáo viên' if g.user.role == 'teacher' else 'Học sinh' }}</span>
      </span>
      <form method="post" action="{{ url_for('auth.logout') }}" class="d-inline">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <button class="btn btn-sm btn-outline-light">Đăng xuất</button>
      </form>
    {% endif %}
  </div>
</nav>
<main class="container pb-5">
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="alert alert-{{ category }} alert-dismissible fade show">{{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
